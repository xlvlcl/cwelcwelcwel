<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Finder | by kejcpi</title>
    <style>
        :root {
            --bg: #050505;            
            --panel: rgba(15, 15, 15, 0.85);          
            --theme: #0055FF;
            --theme-rgb: 0, 85, 255; 
            --theme-glow: rgba(0, 85, 255, 0.4);
            --text: #ffffff;
            --text-dim: #888;
            --gold: #ffcc00;
            --error: #ff4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background-fx {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(at 0% 0%, var(--theme-glow) 0px, transparent 60%),
                        radial-gradient(at 100% 100%, var(--theme-glow) 0px, transparent 60%),
                        radial-gradient(at 50% 50%, rgba(0,0,0,1) 0px, transparent 100%);
            background-attachment: fixed;
        }

        .wrapper { width: 100%; max-width: 1300px; position: relative; padding-bottom: 50px; }

        .system-status {
            position: absolute; top: 0; left: 0; display: flex; flex-direction: column; gap: 8px;
            padding: 10px 15px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 1px solid var(--theme); box-shadow: 0 0 10px var(--theme-glow); border-radius: 8px; z-index: 200;
        }
        .status-item { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; font-weight: bold; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffaa00; box-shadow: 0 0 8px #ffaa00; transition: 0.3s; }
        .dot.online { background: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .dot.error { background: var(--error); box-shadow: 0 0 8px var(--error); }
        .status-label { color: var(--theme); text-transform: uppercase; }

        .theme-panel {
            position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 10px;
            padding: 8px 15px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            border: 1px solid var(--theme); border-radius: 8px; box-shadow: 0 0 15px var(--theme-glow); z-index: 200;
        }
        .color-preview { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #fff; background-color: var(--theme); position: relative; cursor: pointer; transition: 0.3s; }
        .color-preview:hover { transform: scale(1.1); }
        #themePicker { position: absolute; top: -10px; left: -10px; width: 50px; height: 50px; opacity: 0; cursor: pointer; }

        header { text-align: center; margin-bottom: 30px; padding-top: 20px; }
        h1 { font-size: 3rem; font-weight: 900; text-transform: uppercase; letter-spacing: 3px; background: linear-gradient(to bottom, #fff 40%, #999 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; transition: 0.5s; }

        .controls { 
            background: rgba(15, 15, 15, 0.6); backdrop-filter: blur(15px); padding: 25px; 
            border-radius: 12px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 20px; 
        }
        .input-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 180px; }
        label { font-size: 0.7rem; color: var(--theme); font-weight: bold; text-transform: uppercase; margin-left: 5px; }
        input, select { background: rgba(0,0,0,0.4); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 14px; border-radius: 8px; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--theme); box-shadow: 0 0 10px var(--theme-glow); background: rgba(0,0,0,0.6); }
        
        .btn-group button { padding: 12px 30px; background: rgba(0,0,0,0.4); border: 1px solid var(--theme); color: var(--theme); border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; height: 48px; }
        .btn-group button:hover { background: var(--theme); color: #000; box-shadow: 0 0 20px var(--theme); }

        .stats-bar { display: flex; justify-content: center; align-items: center; margin: 10px 0 25px 0; width: 100%; flex-direction: column; }
        #counter { font-size: 1.8rem; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        #counter strong { color: var(--theme); text-shadow: 0 0 15px var(--theme); }

        #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; width: 100%; }
        .card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); 
            border-left: 4px solid var(--theme); padding: 14px 18px; border-radius: 8px; display: flex; align-items: center; 
            gap: 12px; position: relative; overflow: hidden; transition: all 0.3s; transform: translateZ(0); cursor: pointer;
        }
        .card::before { content: ''; position: absolute; top: 0; left: -150%; width: 100%; height: 100%; background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.3), transparent); transition: all 0.6s ease-in-out; z-index: 1; pointer-events: none; }
        .card:hover { background: rgba(var(--theme-rgb), 0.15); border-color: var(--theme); transform: translateY(-7px) scale(1.02); box-shadow: 0 15px 30px -10px rgba(0,0,0,0.5), 0 0 25px var(--theme-glow); }
        .card:hover::before { left: 150%; }
        .card > * { z-index: 2; position: relative; }
        .ping-badge { font-size: 0.75rem; font-family: monospace; font-weight: bold; color: var(--theme); transition: 0.3s; flex-shrink: 0; }
        .id-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--theme); font-weight: bold; padding: 4px 10px; border-radius: 6px; font-family: monospace; transition: 0.3s; flex-shrink: 0; }
        .nick-txt { flex: 1; font-weight: 600; font-size: 1.05rem; transition: 0.3s; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        
        .card:hover .ping-badge, .card:hover .nick-txt { color: #fff; text-shadow: 0 0 5px var(--theme-glow); }
        .card:hover .id-box { background: var(--theme); color: #000; border-color: var(--theme); box-shadow: 0 0 10px var(--theme-glow); }

        .fav-btn { background: transparent !important; border: none !important; color: rgba(255,255,255,0.2) !important; font-size: 1.2rem; cursor: pointer; transition: 0.3s; padding: 0 2px; outline: none; z-index: 5; flex-shrink: 0; }
        .fav-btn:hover { color: var(--gold) !important; transform: scale(1.3) rotate(15deg) !important; }
        .fav-btn.active { color: var(--gold) !important; filter: drop-shadow(0 0 5px rgba(255, 204, 0, 0.8)); }
        
        /* Modal / Panel szczegółów gracza */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: rgba(12, 12, 12, 0.95); border: 1px solid var(--theme);
            box-shadow: 0 0 40px var(--theme-glow); border-radius: 14px;
            padding: 30px; width: 90%; max-width: 450px; position: relative;
            transform: scale(0.85); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-close {
            position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; font-size: 1.1rem;
        }
        .modal-close:hover { background: var(--error); border-color: var(--error); box-shadow: 0 0 10px var(--error); }
        .modal-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; color: #fff; word-break: break-all; padding-right: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        
        .modal-info-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .modal-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); }
        .modal-label { color: var(--text-dim); font-size: 0.8rem; text-transform: uppercase; font-weight: bold; }
        .modal-val { color: var(--theme); font-family: monospace; font-weight: bold; font-size: 0.95rem; }

        .modal-actions { display: flex; flex-wrap: wrap; gap: 10px; }
        .modal-btn {
            flex: 1; min-width: 120px; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold;
            display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; text-transform: uppercase; font-size: 0.8rem; cursor: pointer;
        }
        .modal-btn svg { width: 16px; height: 16px; }
        .modal-btn.steam { background: rgba(102, 192, 244, 0.1); border: 1px solid rgba(102, 192, 244, 0.3); color: #66c0f4; }
        .modal-btn.steam:hover { background: #66c0f4; color: #000; box-shadow: 0 0 15px #66c0f4; border-color: #66c0f4; }
        .modal-btn.discord { background: rgba(88, 101, 242, 0.1); border: 1px solid rgba(88, 101, 242, 0.3); color: #8ea1ff; }
        .modal-btn.discord:hover { background: #5865F2; color: #fff; box-shadow: 0 0 15px #5865F2; border-color: #5865F2; }
        .modal-btn.copy { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; }
        .modal-btn.copy:hover { background: var(--theme); color: #000; border-color: var(--theme); box-shadow: 0 0 15px var(--theme); }

        .hidden-input { display: none; }
    </style>
</head>
<body>

<div class="background-fx"></div>

<!-- Modal / Panel szczegółów -->
<div id="playerModal" class="modal-overlay" onclick="if(event.target === this) closePlayerModal()">
    <div class="modal-content">
        <button class="modal-close" onclick="closePlayerModal()">×</button>
        <div id="modalNick" class="modal-title">Nazwa Gracza</div>
        
        <div class="modal-info-list">
            <div class="modal-row">
                <span class="modal-label">ID na serwerze</span>
                <span id="modalId" class="modal-val">#0</span>
            </div>
            <div class="modal-row">
                <span class="modal-label">Ping</span>
                <span id="modalPing" class="modal-val">0 ms</span>
            </div>
            <div class="modal-row">
                <span class="modal-label">Czas na serwerze</span>
                <span id="modalTime" class="modal-val">0 min</span>
            </div>
        </div>

        <div class="modal-actions">
            <a id="modalSteamBtn" href="#" target="_blank" class="modal-btn steam">

                <span id="steamBtnText">Steam</span>
            </a>
            <a id="modalDiscordBtn" href="#" target="_blank" class="modal-btn discord">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.7 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                <span>Discord</span>
            </a>
            <button id="modalCopyBtn" class="modal-btn copy" onclick="copyPlayerNick()">Kopiuj Nick</button>
        </div>
    </div>
</div>

<div class="wrapper">
    <div class="system-status">
        <div class="status-item"><div id="fivem-dot" class="dot"></div><span class="status-label">Połączenie:</span> <span id="fivem-text">ŁĄCZENIE...</span></div>
    </div>
    
    <div class="theme-panel">
        <span class="theme-label" style="font-size: 0.7rem; font-weight: bold; color: var(--theme);">MOTYW:</span>
        <div class="color-preview"><input type="color" id="themePicker" value="#0055FF"></div>
    </div>

    <header>
        <h1 id="mainTitle">GrandRP Finder</h1>
    </header>

    <div class="controls">
        <div class="input-group">
            <label>Serwer</label>
            <select id="serverSelect" onchange="checkCustomServer()">
                <option value="96ky6e" selected>GrandRP (PL)</option>
                <option value="z75e35">BetterSide</option>
                <option value="ler8myo">OsloRP</option>
                <option value="custom">-- Własne ID --</option>
            </select>
            <input type="text" id="customSrv" class="hidden-input" placeholder="Wpisz ID serwera (np. epk8gp)">
        </div>
        <div class="input-group"><label>Szukaj ID</label><input type="number" id="sid" placeholder="np. 123" oninput="renderDebounced()"></div>
        <div class="input-group"><label>Szukaj Nicku</label><input type="text" id="snick" placeholder="np. imie" oninput="renderDebounced()"></div>
        <div class="btn-group" style="padding-top: 19px; display: flex; gap: 10px;">
            <button id="refreshBtn" onclick="manualRefresh()">ODŚWIEŻ</button>
            <button id="btnToggle" class="active" onclick="toggleList()">Ukryj listę</button>
        </div>
    </div>

    <div class="stats-bar">
        <span id="counter">Online: <strong>0</strong></span>
    </div>
    
    <div id="grid"></div>
</div>

<script>
    let players = [];
    let totalClients = 0;
    let showList = true;
    let favs = JSON.parse(localStorage.getItem('grandrp_favs')) || [];
    let renderTimeout;
    let currentModalNick = "";
    
    let playerJoinTimes = {};
    let playersMap = {};

    function hexToRgb(hex) {
        let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : '0, 85, 255';
    }

    function setTheme(color) {
        document.documentElement.style.setProperty('--theme', color);
        document.documentElement.style.setProperty('--theme-rgb', hexToRgb(color));
        document.documentElement.style.setProperty('--theme-glow', color + '66');
        document.querySelector('.color-preview').style.backgroundColor = color;
        localStorage.setItem('grandrp_theme', color);
    }
    document.getElementById('themePicker').addEventListener('input', (e) => setTheme(e.target.value));

    async function fetchServerData(serverId) {
        const targetUrl = `https://frontend.cfx-services.net/api/servers/single/${serverId}`;
        
        try {
            const res = await fetch(targetUrl);
            if (res.ok) { 
                const json = await res.json(); 
                if (json && json.Data) return json.Data; 
            }
        } catch(e) {}

        const publicProxies = [
            `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,
            `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`
        ];

        for (let proxyUrl of publicProxies) {
            try {
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    const json = await res.json();
                    if (proxyUrl.includes('allorigins')) {
                        const parsed = JSON.parse(json.contents);
                        if (parsed && parsed.Data) return parsed.Data;
                    } else if (json && json.Data) {
                        return json.Data;
                    }
                }
            } catch(e) {}
        }
        return null;
    }

    async function getData(isManual = false) {
        const select = document.getElementById('serverSelect');
        const custom = document.getElementById('customSrv');
        const refreshBtn = document.getElementById('refreshBtn');
        const statusDot = document.getElementById('fivem-dot');
        const statusText = document.getElementById('fivem-text');
        
        let sID = select.value === 'custom' ? custom.value : select.value;
        const title = document.getElementById('mainTitle');
        const grid = document.getElementById('grid');
        
        if (!sID) return;
        
        if(select.value === '96ky6e') title.innerText = "GrandRP Finder";
        else if(select.value === 'z75e35') title.innerText = "BetterSide Finder";
        else if(select.value === 'ler8myo') title.innerText = "OsloRP Finder";
        else title.innerText = "Server Finder";
        
        refreshBtn.innerText = "...";
        statusDot.className = "dot";
        statusText.innerText = "ŁĄCZENIE...";

        if (isManual) {
            players = [];
            totalClients = 0;
            grid.innerHTML = "<p style='grid-column:1/-1; opacity:0.6; text-align:center;'>Pobieranie danych...</p>";
        }
        
        const serverData = await fetchServerData(sID);

        if (serverData) {
            statusDot.className = "dot online";
            statusText.innerText = "POŁĄCZONO";
            
            players = serverData.players || [];
            totalClients = serverData.clients !== undefined ? serverData.clients : players.length;
            
            let now = Date.now();
            let currentIds = new Set();
            players.forEach(p => {
                currentIds.add(p.id);
                if (!playerJoinTimes[p.id]) {
                    playerJoinTimes[p.id] = now;
                }
                playersMap[p.id] = p;
            });
            
            Object.keys(playerJoinTimes).forEach(id => {
                if (!currentIds.has(Number(id))) delete playerJoinTimes[id];
            });

            render();
        } else {
            statusDot.className = "dot error";
            statusText.innerText = "BLOKADA API";
            document.getElementById('counter').innerHTML = `Online: <strong>0</strong>`;
            grid.innerHTML = "<p style='grid-column:1/-1; opacity:0.5; text-align:center;'>FiveM odrzuciło połączenie. Serwer ukrywa graczy lub blokuje zapytania. Spróbuj kliknąć ODŚWIEŻ za chwilę.</p>";
        }
        refreshBtn.innerText = "ODŚWIEŻ";
    }

    function manualRefresh() { getData(true); }

    function render() {
        const sidVal = document.getElementById('sid').value;
        const nickVal = document.getElementById('snick').value.toLowerCase();
        const grid = document.getElementById('grid');
        const counter = document.getElementById('counter');

        let filtered = players.filter(p => 
            (sidVal ? p.id.toString().startsWith(sidVal) : true) &&
            (nickVal ? p.name.toLowerCase().includes(nickVal) : true)
        );

        filtered.sort((a, b) => {
            let aFav = favs.includes(a.id);
            let bFav = favs.includes(b.id);
            if (aFav && !bFav) return -1; 
            if (!aFav && bFav) return 1;  
            return a.id - b.id;             
        });

        counter.innerHTML = `Online: <strong>${(sidVal || nickVal) ? filtered.length : totalClients}</strong>`;

        if (!showList) { grid.innerHTML = ""; return; }

        if (players.length === 0) {
            if (totalClients > 0) {
                grid.innerHTML = "<p style='grid-column:1/-1; opacity:0.8; text-align:center; color: var(--gold); padding: 20px;'>Serwer ukrywa listę graczy (Streamer Mode), ale połączonych jest <strong>" + totalClients + "</strong> osób.</p>";
            } else {
                grid.innerHTML = "<p style='grid-column:1/-1; opacity:0.5; text-align:center;'>Brak graczy online.</p>";
            }
        } else {
            grid.innerHTML = filtered.map(p => {
                let isFav = favs.includes(p.id);
                let favClass = isFav ? 'active' : '';
                let favIcon = isFav ? '★' : '☆'; 
                
                let playerName = p.name || "Nieznany";
                let playerPing = p.ping !== undefined ? p.ping : "?";

                return `
                <div class="card" onclick="openPlayerModal(${p.id})">
                    <div class="ping-badge">${playerPing}ms</div>
                    <div class="id-box">#${p.id}</div>
                    <div class="nick-txt" title="${playerName}">${playerName}</div>
                    <button class="fav-btn ${favClass}" onclick="event.stopPropagation(); toggleFav(${p.id})">${favIcon}</button>
                </div>
                `;
            }).join('');
        }
    }

    function openPlayerModal(id) {
        let p = playersMap[id];
        if (!p) return;

        currentModalNick = p.name || "";
        document.getElementById('modalNick').innerText = p.name || "Nieznany";
        document.getElementById('modalId').innerText = "#" + p.id;
        document.getElementById('modalPing').innerText = (p.ping !== undefined ? p.ping : "?") + " ms";

        let joined = playerJoinTimes[p.id] || Date.now();
        let diffMins = Math.floor((Date.now() - joined) / 60000);
        document.getElementById('modalTime').innerText = diffMins < 1 ? "przed chwilą" : `ok. ${diffMins} min`;

        let steamBtn = document.getElementById('modalSteamBtn');
        let discordBtn = document.getElementById('modalDiscordBtn');
        let steamBtnText = document.getElementById('steamBtnText');

        let hasSteam = false;
        let hasDiscord = false;

        if (p.identifiers && Array.isArray(p.identifiers)) {
            p.identifiers.forEach(identifier => {
                if (identifier.startsWith('steam:')) {
                    let hex = identifier.split(':')[1];
                    try {
                        let steamDec = BigInt('0x' + hex).toString();
                        steamBtn.href = `https://steamcommunity.com/profiles/${steamDec}`;
                        steamBtnText.innerText = "Steam Profil";
                        hasSteam = true;
                    } catch(e) {}
                }
                if (identifier.startsWith('discord:')) {
                    let discordId = identifier.split(':')[1];
                    discordBtn.href = `https://discord.com/users/${discordId}`;
                    hasDiscord = true;
                }
            });
        }

        // Jeśli brak bezpośredniego Steam ID w API FiveM, włącz wyszukiwarkę po nicku
        if (!hasSteam) {
            steamBtn.href = `https://steamcommunity.com/search/users/#text=${encodeURIComponent(p.name || '')}`;
            steamBtnText.innerText = "Szukaj Steam";
            steamBtn.style.display = 'flex';
        } else {
            steamBtn.style.display = 'flex';
        }

        // Ukryj bezpośredni przycisk Discorda tylko gdy serwer/API go nie przesłał
        discordBtn.style.display = hasDiscord ? 'flex' : 'none';

        document.getElementById('playerModal').classList.add('active');
    }

    function closePlayerModal() {
        document.getElementById('playerModal').classList.remove('active');
    }

    function copyPlayerNick() {
        if (!currentModalNick) return;
        navigator.clipboard.writeText(currentModalNick).then(() => {
            const btn = document.getElementById('modalCopyBtn');
            const orig = btn.innerText;
            btn.innerText = "SKOPIOWANO!";
            setTimeout(() => { btn.innerText = orig; }, 1500);
        });
    }

    function toggleList() {
        showList = !showList;
        const btn = document.getElementById('btnToggle');
        if (showList) {
            btn.innerText = "Ukryj listę";
            btn.classList.add('active');
        } else {
            btn.innerText = "Pokaż listę";
            btn.classList.remove('active');
        }
        render();
    }

    function toggleFav(id) {
        if (favs.includes(id)) favs = favs.filter(f => f !== id);
        else favs.push(id);
        localStorage.setItem('grandrp_favs', JSON.stringify(favs));
        render(); 
    }

    function renderDebounced() {
        clearTimeout(renderTimeout);
        renderTimeout = setTimeout(render, 150);
    }

    function checkCustomServer() {
        const selectVal = document.getElementById('serverSelect').value;
        document.getElementById('customSrv').style.display = selectVal === 'custom' ? 'block' : 'none';
        
        localStorage.setItem('grandrp_last_server', selectVal);
        getData(true); 
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('grandrp_theme');
        if(savedTheme) setTheme(savedTheme);

        const savedServer = localStorage.getItem('grandrp_last_server');
        if(savedServer) {
            document.getElementById('serverSelect').value = savedServer;
            if(savedServer === 'custom') {
                document.getElementById('customSrv').style.display = 'block';
            }
        }

        document.getElementById('customSrv').addEventListener('input', (e) => {
            localStorage.setItem('grandrp_custom_id', e.target.value);
        });
        const savedCustom = localStorage.getItem('grandrp_custom_id');
        if(savedCustom) document.getElementById('customSrv').value = savedCustom;

        setTimeout(() => { getData(true); }, 300);
        setInterval(() => getData(false), 60000); 
    });
</script>
</body>
</html>
